<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Livre de Recettes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-amber-50/40 text-stone-800 min-h-screen flex flex-col font-sans">

  <!-- En-tête -->
  <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <h1 class="text-2xl font-bold flex items-center gap-2 cursor-pointer" onclick="showCatalog()">
        <i class="fa-solid font-bold fa-utensils"></i> Mon Carnet Gourmand
      </h1>
      <div class="relative w-full sm:w-72" id="search-container">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-stone-400"></i>
        <input type="text" id="search" placeholder="Rechercher une recette..." 
               class="w-full pl-9 pr-4 py-2 rounded-full text-stone-800 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400">
      </div>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
    
    <!-- Grille de cartes de recettes -->
    <div id="recipe-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="col-span-full text-center text-stone-500 py-12">Chargement de vos délicieuses recettes...</p>
    </div>

    <!-- Vue détaillée d'une recette -->
    <div id="recipe-detail" class="hidden bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-stone-200 max-w-3xl mx-auto">
      <button onclick="showCatalog()" class="mb-6 inline-flex items-center gap-2 text-emerald-700 font-semibold hover:underline">
        <i class="fa-solid fa-arrow-left"></i> Retour aux recettes
      </button>
      <div id="detail-content" class="prose max-w-none prose-emerald space-y-6 prose-h1:text-3xl prose-h1:mb-4 prose-h2:text-xl prose-h2:mt-8 prose-h2:mb-3 prose-ul:list-disc prose-ul:pl-5 prose-ol:list-decimal prose-ol:pl-5 prose-li:my-2"></div>
    </div>

  </main>

  <footer class="bg-stone-100 border-t border-stone-200 text-center py-4 text-xs text-stone-500">
    Hébergé sur GitHub Pages 🍳
  </footer>

  <script>
    // ⚠️ Remplace par ton pseudo GitHub et le nom exact de ton dépôt
    const GITHUB_USER = "SkiZooFrene";
    const GITHUB_REPO = "livre-de-cuisine";
    
    let allRecipes = [];

    async function loadRecipes() {
      const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/recipes`;
      
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("Dossier recipes introuvable");
        const files = await response.json();
        
        const markdownFiles = files.filter(file => file.name.endsWith('.md'));
        allRecipes = [];

        for (let file of markdownFiles) {
          const res = await fetch(file.download_url);
          const text = await res.text();
          
          const titleMatch = text.match(/^#\s+(.*)$/m);
          const title = titleMatch ? titleMatch[1] : file.name.replace('.md', '');
          
          allRecipes.push({
            title: title,
            file: file.path,
            content: text,
            name: file.name
          });
        }

        displayRecipes(allRecipes);
      } catch (err) {
        console.error(err);
        document.getElementById('recipe-grid').innerHTML = `
          <div class="col-span-full text-center py-12 bg-white rounded-2xl border border-stone-200 p-8">
            <p class="text-stone-700 font-semibold mb-2">Presque prêt !</p>
            <p class="text-stone-500 text-sm">Le dossier <code class="bg-stone-100 px-2 py-1 rounded text-emerald-700">recipes/</code> n'existe pas encore ou ton pseudo GitHub dans le code est incorrect.</p>
          </div>`;
      }
    }

    function displayRecipes(recipes) {
      const grid = document.getElementById('recipe-grid');
      grid.innerHTML = '';

      if (recipes.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center text-stone-500 py-12">Aucune recette pour le moment. Crée ton premier fichier .md dans le dossier recipes/</p>`;
        return;
      }

      recipes.forEach(r => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition border border-stone-200 cursor-pointer flex flex-col p-6";
        card.onclick = () => openRecipe(r.file);

        card.innerHTML = `
          <div class="flex items-center gap-3 mb-3">
            <span class="bg-emerald-100 text-emerald-800 p-3 rounded-xl text-lg">
              <i class="fa-solid fa-utensils"></i>
            </span>
            <h2 class="text-xl font-bold text-stone-800">${r.title}</h2>
          </div>
          <p class="text-stone-500 text-sm mt-auto">Clique pour lire la recette...</p>
        `;
        grid.appendChild(card);
      });
    }

    function openRecipe(filePath) {
      fetch(`https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${filePath}`)
        .then(res => res.text())
        .then(mdText => {
          document.getElementById('recipe-grid').classList.add('hidden');
          document.getElementById('search-container').classList.add('hidden');
          
          const detail = document.getElementById('recipe-detail');
          document.getElementById('detail-content').innerHTML = marked.parse(mdText);
          detail.classList.remove('hidden');
          window.scrollTo(0, 0);
        });
    }

    function showCatalog() {
      document.getElementById('recipe-detail').classList.add('hidden');
      document.getElementById('recipe-grid').classList.remove('hidden');
      document.getElementById('search-container').classList.remove('hidden');
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allRecipes.filter(r => r.title.toLowerCase().includes(query));
      displayRecipes(filtered);
    });

    loadRecipes();
  </script>
</body>
</html>
